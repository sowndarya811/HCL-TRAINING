<!DOCTYPE html>
<html>
<head>
    <title>Instagram Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="left">
            <div class="logo"></div>
            <h1>See everyday moments from your</h1>
            <h2>close friends.</h2>

            <div class="photos">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=300"class="photo1">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300"class="photo2">
                <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=300"class="photo3">
            </div>
        </div>
        <div class="right">
            <div class="login">
                <h3>Log into Instagram</h3>
                <input type="text" placeholder="Mobile number, username or email">
                <input type="password" placeholder="Password">
                <button class="loginbtn">Log in</button>
                <a href="#">Forgot password?</a>
                <button class="facebook">&nbsp; Log in with Facebook</button>
                <button class="create">Create new account</button>
                <div class="meta">∞ <span>Meta</span></div>
            </div>
        </div>
    </div>
</body>
</html>
