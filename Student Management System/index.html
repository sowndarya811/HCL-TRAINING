
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <header class="header">
            <div>
                <h1>Student Management</h1>
                <p>Manage and maintain student information</p>
            </div>

            <div class="header-line"></div>
        </header>


        <main>

            <!-- FORM -->

            <section class="form-card">

                <div class="section-title">
                    <h2>Student Information</h2>
                    <p>Enter the details of the student below</p>
                </div>


                <form id="studentForm">

                    <div class="form-grid">

                        <div class="field">
                            <label>Student ID</label>

                            <input
                                type="text"
                                id="studentId"
                                placeholder="STU001"
                                required
                            >
                        </div>


                        <div class="field">
                            <label>Student Name</label>

                            <input
                                type="text"
                                id="studentName"
                                placeholder="Enter full name"
                                required
                            >
                        </div>


                        <div class="field">
                            <label>Gender</label>

                            <select id="gender" required>

                                <option value="">
                                    Select gender
                                </option>

                                <option value="Male">
                                    Male
                                </option>

                                <option value="Female">
                                    Female
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>
                        </div>


                        <div class="field">
                            <label>Date of Birth</label>

                            <input
                                type="date"
                                id="dob"
                                required
                            >
                        </div>


                        <div class="field">
                            <label>Email Address</label>

                            <input
                                type="email"
                                id="email"
                                placeholder="student@gmail.com"
                                required
                            >
                        </div>


                        <div class="field">
                            <label>Phone Number</label>

                            <input
                                type="tel"
                                id="phone"
                                placeholder="10 digit phone number"
                                maxlength="10"
                                required
                            >
                        </div>


                        <div class="field">
                            <label>Department</label>

                            <select id="department" required>

                                <option value="">
                                    Select department
                                </option>

                                <option value="Information Technology">
                                    Information Technology
                                </option>

                                <option value="Computer Science">
                                    Computer Science
                                </option>

                                <option value="Electronics and Communication">
                                    Electronics and Communication
                                </option>

                                <option value="Electrical and Electronics">
                                    Electrical and Electronics
                                </option>

                                <option value="Mechanical">
                                    Mechanical
                                </option>

                                <option value="Civil">
                                    Civil
                                </option>

                            </select>
                        </div>


                        <div class="field">
                            <label>Academic Year</label>

                            <select id="year" required>

                                <option value="">
                                    Select year
                                </option>

                                <option value="1st Year">
                                    1st Year
                                </option>

                                <option value="2nd Year">
                                    2nd Year
                                </option>

                                <option value="3rd Year">
                                    3rd Year
                                </option>

                                <option value="4th Year">
                                    4th Year
                                </option>

                            </select>
                        </div>


                        <div class="field">
                            <label>Section</label>

                            <select id="section" required>

                                <option value="">
                                    Select section
                                </option>

                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="D">D</option>

                            </select>
                        </div>


                        <div class="field">
                            <label>CGPA</label>

                            <input
                                type="number"
                                id="cgpa"
                                placeholder="0.00 - 10.00"
                                min="0"
                                max="10"
                                step="0.01"
                                required
                            >
                        </div>

                    </div>


                    <div class="field address-field">

                        <label>Address</label>

                        <textarea
                            id="address"
                            placeholder="Enter student's address"
                            required
                        ></textarea>

                    </div>


                    <div class="form-actions">

                        <button
                            type="submit"
                            id="submitBtn"
                            class="primary-btn"
                        >
                            Insert Student
                        </button>

                        <button
                            type="button"
                            class="secondary-btn"
                            onclick="clearForm()"
                        >
                            Clear
                        </button>

                    </div>

                </form>

            </section>


            <!-- TABLE -->

            <section class="records-card">

                <div class="records-header">

                    <div>
                        <h2>Student Records</h2>
                        <p>View and manage registered students</p>
                    </div>

                    <input
                        type="text"
                        id="search"
                        class="search-box"
                        placeholder="Search by ID, name or department"
                    >

                </div>


                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>
                                <th>Student ID</th>
                                <th>Name</th>
                                <th>Gender</th>
                                <th>Email</th>
                                <th>Department</th>
                                <th>Year</th>
                                <th>Section</th>
                                <th>CGPA</th>
                                <th>Action</th>
                            </tr>

                        </thead>


                        <tbody id="studentTable">

                        </tbody>

                    </table>

                </div>


                <div id="noData" class="no-data">

                    No student records available

                </div>

            </section>

        </main>


        <footer>

            <p>Student Management System</p>

        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
